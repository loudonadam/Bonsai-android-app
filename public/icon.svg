<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#FCFBF7" />
  
  <!-- Outer Decorative Ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#1B3B2B" stroke-width="6" opacity="0.15" />
  
  <g transform="translate(256, 260)">
    <!-- Bonsai Pot (Shallow Rectangle with feet) -->
    <path d="M-130 110 L130 110 L115 145 L-115 145 Z" fill="#4A3B32" stroke="#2D221E" stroke-width="8" stroke-linejoin="round" />
    <rect x="-95" y="145" width="24" height="15" rx="4" fill="#2D221E" />
    <rect x="71" y="145" width="24" height="15" rx="4" fill="#2D221E" />
    
    <!-- Soil mound in pot -->
    <path d="M-115 110 C-60 92 60 92 115 110 Z" fill="#655245" />

    <!-- Trunk (Graceful S-curve with movement/taper) -->
    <path d="M-10 100 
             C-25 70, -35 40, -10 15 
             C10 -5, 30 -25, 10 -65 
             C0 -85, -5 -100, -8 -110
             L8 -110
             C12 -95, 15 -80, 28 -60
             C45 -30, 30 0, 10 20
             C-10 40, -5 68, 12 100 Z" 
          fill="#5C4D42" stroke="#403228" stroke-width="4" stroke-linejoin="round" />

    <!-- Jin/Shari (subtle deadwood effect near bottom of trunk) -->
    <path d="M-8 80 C-4 70, -2 60, -9 50 C-11 55, -12 65, -10 75 Z" fill="#D2C5B8" />

    <!-- Branches and Foliage clouds (styled overlapping circles with organic shape) -->
    
    <!-- Top Canopy (Apex) -->
    <g transform="translate(0, -120)">
      <ellipse cx="0" cy="0" rx="55" ry="32" fill="#2D5A27" />
      <ellipse cx="-20" cy="-10" rx="35" ry="22" fill="#3D7A35" />
      <ellipse cx="20" cy="-5" rx="38" ry="24" fill="#3D7A35" />
      <ellipse cx="0" cy="-15" rx="25" ry="16" fill="#4E9944" />
    </g>
    
    <!-- Right Middle Branch & Foliage -->
    <g transform="translate(45, -50)">
      <path d="M-25 15 C-10 0, 15 -10, 25 -10" fill="none" stroke="#5C4D42" stroke-width="7" stroke-linecap="round" />
      <ellipse cx="15" cy="-15" rx="45" ry="25" fill="#1D4A17" />
      <ellipse cx="-10" cy="-20" rx="28" ry="18" fill="#2D5A27" />
      <ellipse cx="10" cy="-25" rx="30" ry="20" fill="#3D7A35" />
    </g>
    
    <!-- Left Major Branch & Foliage -->
    <g transform="translate(-50, -10)">
      <path d="M25 15 C10 0, -15 -10, -30 -12" fill="none" stroke="#5C4D42" stroke-width="9" stroke-linecap="round" />
      <ellipse cx="-25" cy="-20" rx="55" ry="28" fill="#1D4A17" />
      <ellipse cx="10" cy="-25" rx="32" ry="20" fill="#2D5A27" />
      <ellipse cx="-15" cy="-30" rx="35" ry="22" fill="#3D7A35" />
    </g>
  </g>
</svg>
